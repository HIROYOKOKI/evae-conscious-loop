name: Publish Package to npm

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (for example v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && 'v0.2.0' || github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build:lib
      - run: npm test
      - run: npm run lint

      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="$(node -p "require('./packages/conscious-loop/package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match package version v$VERSION"
            exit 1
          fi

      - name: Publish evae-conscious-loop if not already published
        working-directory: packages/conscious-loop
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "evae-conscious-loop@$VERSION" version >/dev/null 2>&1; then
            echo "evae-conscious-loop@$VERSION is already published; nothing to do."
            exit 0
          fi
          npm publish --access public
