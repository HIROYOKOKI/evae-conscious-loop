name: Publish Package to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build:lib
      - run: npm test
      - run: npm run lint

      - name: Verify release tag matches package version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(node -p "require('./packages/conscious-loop/package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match package version v$VERSION"
            exit 1
          fi

      - name: Publish evae-conscious-loop
        working-directory: packages/conscious-loop
        run: npm publish --access public
